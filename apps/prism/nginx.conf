# Global, not per-IP: every client arrives as the tunnel IP. Caps brute force and hash CPU.
limit_req_zone "global" zone=global:1m rate=10r/s;

server {
    listen 8080;
    server_tokens off;
    root /srv/files;
    disable_symlinks on;

    limit_req zone=global burst=20 nodelay;
    limit_req_status 429;

    auth_basic "prism";
    auth_basic_user_file /etc/nginx/auth/htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Keep files out of shared-PC and Cloudflare caches.
    add_header Cache-Control "private, no-store" always;

    location / {
        autoindex on;
        autoindex_exact_size off;
        limit_except GET { deny all; }
    }

    # ext4 root of the PVC.
    location ^~ /lost+found { return 404; }
}
