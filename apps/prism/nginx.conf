server {
    listen 8080;
    server_tokens off;
    root /srv/files;

    auth_basic "prism";
    auth_basic_user_file /etc/nginx/auth/htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        autoindex on;
        autoindex_exact_size off;
        limit_except GET { deny all; }
    }

    # ext4 root of the PVC.
    location ^~ /lost+found { return 404; }
}
