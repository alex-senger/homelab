apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prism

resources:
  - namespace.yaml
  - pvc.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# Hash suffix rolls the pod on config change; the subPath mount never live-reloads.
configMapGenerator:
  - name: prism-nginx
    files:
      - nginx.conf
