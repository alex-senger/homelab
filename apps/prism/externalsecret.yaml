apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prism-htpasswd
  namespace: prism
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: prism-htpasswd
    creationPolicy: Owner
  data:
    # One `user:<sha512-crypt>` line (`openssl passwd -6`).
    - secretKey: htpasswd
      remoteRef: { key: prism/auth, property: htpasswd }
