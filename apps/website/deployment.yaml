apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website
  labels:
    app: website
spec:
  replicas: 1
  # RWO volume on a single node: Recreate avoids rollout multi-attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: website
          # renovate: datasource=docker depName=ghcr.io/alex-senger/personal-website
          image: ghcr.io/alex-senger/personal-website:v1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          volumeMounts:
            # CV PDFs live in the PVC (populated out-of-band); nginx only reads.
            - name: downloads
              mountPath: /usr/share/nginx/html/downloads
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: website-downloads
