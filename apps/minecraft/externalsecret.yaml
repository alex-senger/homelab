apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-access
  namespace: minecraft
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minecraft-access
    creationPolicy: Owner
  # whitelist/ops are player usernames (kept out of this public repo); rcon
  # password gates the admin console. Seed with:
  #   bao kv put secret/minecraft/access \
  #     whitelist=Name1,Name2 ops=Name1 rcon-password=<random>
  data:
    - secretKey: whitelist
      remoteRef: { key: minecraft/access, property: whitelist }
    - secretKey: ops
      remoteRef: { key: minecraft/access, property: ops }
    - secretKey: rcon-password
      remoteRef: { key: minecraft/access, property: rcon-password }
