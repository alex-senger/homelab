apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  # RWO world volume on a single node: Recreate avoids rollout multi-attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # itzg image runs as uid/gid 1000; fsGroup makes the world PVC writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          # java25 tag: 26.3 requires JDK 25.
          # renovate: datasource=docker depName=itzg/minecraft-server
          image: itzg/minecraft-server:java25
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            # 26.1.2, not the newest 26.3: it's the latest MC where BOTH
            # EssentialsX and CoreProtect have Modrinth builds (they lag the
            # year-versioned releases). Bump as the plugin ecosystem catches up.
            - name: VERSION
              value: "26.1.2"
            - name: TZ
              value: Etc/UTC
            # ~6G heap + Aikar's GC flags; container limit leaves off-heap room.
            - name: MEMORY
              value: 6G
            - name: USE_AIKAR_FLAGS
              value: "true"
            - name: ONLINE_MODE
              value: "TRUE"
            # Public server: whitelist is the access gate (usernames from secret,
            # resolved to UUIDs against Mojang at boot). OVERRIDE keeps the file
            # in sync with the secret so removing a name revokes access.
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: OVERRIDE_WHITELIST
              value: "TRUE"
            - name: WHITELIST
              valueFrom:
                secretKeyRef:
                  name: minecraft-access
                  key: whitelist
            - name: OPS
              valueFrom:
                secretKeyRef:
                  name: minecraft-access
                  key: ops
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-access
                  key: rcon-password
            # Tuned down for the Ivy Bridge single core (tick is single-threaded).
            - name: VIEW_DISTANCE
              value: "10"
            - name: SIMULATION_DISTANCE
              value: "7"
            - name: MAX_PLAYERS
              value: "10"
            - name: MOTD
              value: "senger-solutions"
            # Auto-fetch plugins from Modrinth, matched to VERSION. An unresolved
            # plugin aborts startup, so every entry must have a 26.1.2 build.
            - name: MODRINTH_PROJECTS
              value: essentialsx,luckperms,coreprotect,chunky,viaversion,viabackwards,vaultunlocked
            # spark isn't published on Modrinth for the Paper loader; pull it from
            # SpigotMC (id 57242) via Spiget, which doesn't game-version filter.
            - name: SPIGET_RESOURCES
              value: "57242"
            - name: MODRINTH_DOWNLOAD_DEPENDENCIES
              value: none
            - name: PATCH_DEFINITIONS
              value: /patches/paper-patches.json
            - name: MC_HEALTH_EXTRA_ARGS
              value: "-use-proxy"
          ports:
            - name: mc
              containerPort: 25565
            - name: rcon
              containerPort: 25575
          # World gen + first-run plugin downloads are slow on this CPU; give the
          # startup probe a long budget before liveness takes over.
          startupProbe:
            exec:
              command: [mc-health]
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command: [mc-health]
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command: [mc-health]
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # No CPU limit: a hard cap throttles the tick thread and tanks TPS.
            # Request is a scheduling floor only; idle it uses ~40m, and the
            # single-threaded tick still bursts onto idle cores. Kept at 500m so
            # the near-full node has room for rollouts.
            requests:
              cpu: 500m
              memory: 6500Mi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
            # readOnlyRootFilesystem: JVM tmpdir + entrypoint scratch need /tmp.
            - name: tmp
              mountPath: /tmp
            - name: paper-patches
              mountPath: /patches
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: tmp
          emptyDir: {}
        - name: paper-patches
          configMap:
            name: paper-patches
