apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minecraft

resources:
  - namespace.yaml
  - pvc.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml

# Applied by the itzg entrypoint (PATCH_DEFINITIONS) on every boot.
configMapGenerator:
  - name: paper-patches
    files:
      - paper-patches.json
