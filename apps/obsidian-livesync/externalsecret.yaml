apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb-admin
  namespace: obsidian-livesync
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: couchdb-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: obsidian-livesync/couchdb, property: username }
    - secretKey: password
      remoteRef: { key: obsidian-livesync/couchdb, property: password }
    - secretKey: erlang-cookie
      remoteRef: { key: obsidian-livesync/couchdb, property: erlang-cookie }
