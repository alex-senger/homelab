; Settings from the Self-hosted LiveSync server setup guide.
[couchdb]
single_node = true
; Fixed so replication checkpoints survive restarts (local.d is an emptyDir).
uuid = 8aaa9fdaaf7047b0b7767fe8d28df732
max_document_size = 50000000

[chttpd]
; Anonymous requests are refused everywhere except /_up (kubelet probes).
require_valid_user_except_for_up = true
; Cloudflare caps proxied requests at 100 MB; LiveSync uploads in chunks.
max_http_request_size = 104857600
enable_cors = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"

[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer, x-livesync-key
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
