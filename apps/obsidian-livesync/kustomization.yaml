apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: obsidian-livesync

resources:
  - namespace.yaml
  - pvc.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# Hash suffix rolls the pod on config change; the subPath mount never live-reloads.
configMapGenerator:
  - name: couchdb-config
    files:
      - livesync.ini
