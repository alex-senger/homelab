# LAN-only: on the external Gateway for the wildcard cert, but absent from the VPS SNI allowlist
# (vps/group_vars/vps/main.yml), which closes any unlisted SNI. LAN clients resolve it to Gateway .3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
  hostnames:
    - argocd.senger-solutions.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
