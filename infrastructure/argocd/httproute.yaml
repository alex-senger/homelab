# LAN-only: attached to the external Gateway for a valid wildcard cert + clean
# hostname, but deliberately NOT added to the VPS nginx SNI relay, so it is
# reachable on the LAN only (resolve argocd.senger-solutions.com -> Gateway .3
# via local DNS). ArgoCD is a control plane; keep it off the public path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
  hostnames:
    - argocd.senger-solutions.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
