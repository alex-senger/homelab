configs:
  cm:
    kustomize.buildOptions: --enable-helm
    application.resourceTrackingMethod: annotation

  params:
    # TLS terminates at the Gateway from sub-project #3 onward. Until then
    # access is via kubectl port-forward, so serving plaintext internally
    # avoids the self-signed-certificate warning loop.
    server.insecure: true

# Dex returns in sub-project #6, when Authelia becomes the OIDC provider.
dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
