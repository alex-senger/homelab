configs:
  cm:
    kustomize.buildOptions: --enable-helm
    application.resourceTrackingMethod: annotation
    url: https://argocd.senger-solutions.com
    oidc.config: |
      name: Authelia
      issuer: https://auth.senger-solutions.com
      clientID: argocd
      clientSecret: $oidc.argocd.clientSecret
      requestedScopes: [openid, profile, email, groups]
      requestedIDTokenClaims:
        groups:
          essential: true

  rbac:
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin

  params:
    # TLS terminates at the Gateway from sub-project #3 onward. Until then
    # access is via kubectl port-forward, so serving plaintext internally
    # avoids the self-signed-certificate warning loop.
    server.insecure: true

# Dex stays disabled; Authelia is the OIDC provider (#7b).
dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
