configs:
  cm:
    kustomize.buildOptions: --enable-helm
    application.resourceTrackingMethod: annotation
    url: https://argocd.senger-solutions.com
    oidc.config: |
      name: Authelia
      issuer: https://auth.senger-solutions.com
      clientID: argocd
      clientSecret: $oidc.argocd.clientSecret
      requestedScopes: [openid, profile, email, groups]
      requestedIDTokenClaims:
        groups:
          essential: true

  rbac:
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin

  params:
    # TLS terminates at the Gateway.
    server.insecure: true

# Authelia is the OIDC provider.
dex:
  enabled: false

notifications:
  enabled: false

controller:
  metrics:
    enabled: true   # argocd_app_info (sync/health) for the Grafana front page
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
