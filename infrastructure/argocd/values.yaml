# ArgoCD performs OIDC discovery/JWKS/token calls to the issuer host SERVER-SIDE.
# auth.senger-solutions.com resolves publicly to the VPS/Cloudflare edge, which
# fails from in-cluster (Cloudflare error 525 on the server-side call). Pin the
# issuer host to the in-cluster Gateway LB IP so those calls hit the Gateway
# directly (valid wildcard cert, no public hairpin). The issuer stays the public
# URL (oidc.config below) so the `iss` claim still matches the browser redirect.
global:
  hostAliases:
    - ip: 192.168.178.3
      hostnames:
        - auth.senger-solutions.com

configs:
  cm:
    kustomize.buildOptions: --enable-helm
    application.resourceTrackingMethod: annotation
    url: https://argocd.senger-solutions.com
    oidc.config: |
      name: Authelia
      issuer: https://auth.senger-solutions.com
      clientID: argocd
      clientSecret: $oidc.argocd.clientSecret
      requestedScopes: [openid, profile, email, groups]
      requestedIDTokenClaims:
        groups:
          essential: true

  rbac:
    policy.default: ""
    policy.csv: |
      g, argocd-admins, role:admin

  params:
    # TLS terminates at the Gateway from sub-project #3 onward. Until then
    # access is via kubectl port-forward, so serving plaintext internally
    # avoids the self-signed-certificate warning loop.
    server.insecure: true

# Dex stays disabled; Authelia is the OIDC provider (#7b).
dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi
