apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-clientsecret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    # Merge, not Owner: argocd-secret is created by the argo-cd Helm chart and
    # ArgoCD itself writes server.secretkey / webhook secrets / admin password
    # hash into it at runtime. ArgoCD's `$<key>` (no colon) reference syntax
    # in oidc.config resolves bare keys from argocd-secret specifically (see
    # util/settings/settings.go ReplaceStringSecret) — a separate Secret only
    # works with the colon form `$<secret>:<key>`. Merge adds just the
    # oidc.argocd.clientSecret key without taking ownership of the Secret.
    name: argocd-secret
    creationPolicy: Merge
    template:
      data:
        oidc.argocd.clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef: { key: authelia/oidc, property: argocd-client-secret }
