apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-clientsecret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    # Merge, not Owner: argocd-secret is chart-owned and ArgoCD writes its own
    # keys into it. ArgoCD's bare `$key` oidc ref resolves only from
    # argocd-secret; Merge adds oidc.argocd.clientSecret without owning it.
    name: argocd-secret
    creationPolicy: Merge
    template:
      data:
        oidc.argocd.clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef: { key: authelia/oidc, property: argocd-client-secret }
