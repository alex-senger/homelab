apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  - httproute.yaml
  - oidc-clientsecret-externalsecret.yaml

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.9.2
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    # No includeCRDs: the chart ships its CRDs as plain templates (crds.install),
    # not via Helm's crds/ dir, so the flag is a no-op here.
