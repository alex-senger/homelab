apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level `namespace:` transformer: ClusterPolicy is cluster-scoped and must not get a
# metadata.namespace stamped on it. Namespaced resources already land in kyverno via the
# helmCharts entry's `namespace:` (passed to `helm template --namespace`) and namespace.yaml.

resources:
  - namespace.yaml
  - policies/disallow-latest-tag.yaml
  - policies/restrict-image-registries.yaml
  - policies/generate-default-netpol.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/
    version: 3.9.1
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    valuesFile: values.yaml
