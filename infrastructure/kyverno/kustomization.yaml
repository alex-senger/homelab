apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno

resources:
  - namespace.yaml
  - policies/disallow-latest-tag.yaml
  - policies/restrict-image-registries.yaml
  - policies/generate-default-netpol.yaml

helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno/
    # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno/
    version: 3.9.1
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    valuesFile: values.yaml
