# Enforce: allow images only from an approved registry allowlist.
# Canonical: https://github.com/kyverno/policies (best-practices/restrict-image-registries), adapted to the
# Kyverno 1.19 per-rule validate.failureAction API and our allowlist.
#
# Implicit Docker Hub shorthand ("redis:8", "itzg/minecraft-server:x") does NOT match "docker.io/*":
# always write the docker.io/ prefix (also for `kubectl debug --image`). kube-system and kyverno are
# excluded by the webhook's namespaceSelector, not here.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Images from unknown registries may not be scanned or trustworthy. Restricts
      container images to an approved allowlist: ghcr.io, docker.io, quay.io,
      registry.k8s.io, mirror.gcr.io, ecr-public.aws.com.
spec:
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: "Image registry not in the allowlist (ghcr.io, docker.io, quay.io, registry.k8s.io, mirror.gcr.io, ecr-public.aws.com, reg.kyverno.io)."
        pattern:
          spec:
            "=(ephemeralContainers)":
              - image: "ghcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/* | mirror.gcr.io/* | ecr-public.aws.com/* | reg.kyverno.io/*"
            "=(initContainers)":
              - image: "ghcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/* | mirror.gcr.io/* | ecr-public.aws.com/* | reg.kyverno.io/*"
            containers:
              - image: "ghcr.io/* | docker.io/* | quay.io/* | registry.k8s.io/* | mirror.gcr.io/* | ecr-public.aws.com/* | reg.kyverno.io/*"
