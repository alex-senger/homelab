apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# VM operator CRDs at wave 19 (before monitoring at 20); the k8s-stack chart
# doesn't render CRDs under --enable-helm, so inflate them here (mirrors
# gateway-api-crds).
helmCharts:
  - name: victoria-metrics-operator-crds
    repo: https://victoriametrics.github.io/helm-charts/
    # renovate: datasource=helm depName=victoria-metrics-operator-crds registryUrl=https://victoriametrics.github.io/helm-charts/
    version: 0.14.0
    releaseName: vm-crds
