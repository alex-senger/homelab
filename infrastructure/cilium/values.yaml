# These values are Talos-specific. Do not change them without reading
# docs/runbooks/cilium-recovery.md first — a bad value here takes down
# all pod networking.

# Talos mounts cgroups itself; Cilium must not try.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Pod CIDRs are allocated by kube-controller-manager, not Cilium.
ipam:
  mode: kubernetes

k8sServiceHost: localhost
k8sServicePort: 7445

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
