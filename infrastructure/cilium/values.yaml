# These values are Talos-specific. Do not change them without reading
# docs/runbooks/cilium-recovery.md first — a bad value here takes down
# all pod networking.

# Talos mounts cgroups itself; Cilium must not try.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Pod CIDRs are allocated by kube-controller-manager, not Cilium.
ipam:
  mode: kubernetes

k8sServiceHost: localhost
k8sServicePort: 7445

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# --- External reach (sub-project #4) ---

# Gateway API controller. CRDs are installed separately by
# infrastructure/gateway-api-crds (Cilium ships none). enableProxyProtocol stays
# false: the VPS shares :443 with Pangolin via SNI and cannot add a PROXY header,
# so the Gateway must not expect one (the trade-off is no real client IP).
gatewayAPI:
  enabled: true
  enableProxyProtocol: false

# L2 announcements answer ARP for LoadBalancer IPs on the LAN, so a
# CiliumLoadBalancerIPPool address becomes reachable from other hosts.
l2announcements:
  enabled: true

# L2 announcements take leader-election Leases; the default client rate limit
# is too low and produces lease churn warnings. Raise it.
k8sClientRateLimit:
  qps: 10
  burst: 20
