# Talos-specific; read docs/runbooks/cilium-recovery.md before changing (a bad
# value takes down all pod networking).

# Talos mounts cgroups; Cilium must not.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Pod CIDRs from kube-controller-manager, not Cilium.
ipam:
  mode: kubernetes

k8sServiceHost: localhost
k8sServicePort: 7445

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# --- External reach ---
# CRDs via infrastructure/gateway-api-crds. enableProxyProtocol=false: the VPS
# shares :443 via SNI and can't add a PROXY header (trade-off: no real client IP).
gatewayAPI:
  enabled: true
  enableProxyProtocol: false

# xdsMode=split: 1.20 'ads' mode fails to deliver Gateway L7 xDS (cilium #48548).
envoy:
  xdsMode: split

# L2 ARP for LoadBalancer IPs on the LAN.
l2announcements:
  enabled: true

# Raise from defaults — L2 lease election churns the client rate limit otherwise.
k8sClientRateLimit:
  qps: 10
  burst: 20

# --- Hubble metrics (#6) ---
# cilium-config change: needs a manual `rollout restart` after merge (no checksum;
# see cilium-recovery.md). Also creates the hubble-metrics Service (:9965).
hubble:
  enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - httpV2

# One node ⇒ one operator (default 2 + anti-affinity would leave one Pending).
operator:
  replicas: 1
