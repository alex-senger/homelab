apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    # Plaintext client secret, injected as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
    - secretKey: client-secret
      remoteRef:
        key: grafana/oidc
        property: client-secret
