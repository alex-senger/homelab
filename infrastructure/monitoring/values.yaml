# victoria-metrics-k8s-stack 0.92.1 — single-node, memory-budgeted.
# See docs/superpowers/specs/2026-09-09-observability-victoriametrics-design.md

# --- VM operator ---
victoria-metrics-operator:
  enabled: true
  crds:
    # CRDs via infrastructure/monitoring-crds. Disable the stack's own CRD
    # machinery (crds.enabled needs plain: false too).
    enabled: false
    plain: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# --- Metrics store: VMSingle ---
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"          # spec §3
    replicaCount: 1
    storage:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn    # default Delete class; metrics are reproducible
      resources:
        requests:
          storage: 10Gi             # spec §3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
# --- Scrape agent: VMAgent ---
vmagent:
  enabled: true
  spec:
    selectAllByDefault: true        # auto-select every VMServiceScrape/VMPodScrape
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# --- Alerting ---
vmalert:
  enabled: true
  spec:
    evaluationInterval: 30s
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
alertmanager:
  enabled: true
  # Full routing config (recipient, Resend key, healthchecks URL from OpenBao)
  # is rendered by the alerting ExternalSecret into this Secret's
  # alertmanager.yaml; configSecret makes the operator use it verbatim.
  spec:
    configSecret: alertmanager-config
    selectAllByDefault: false        # config fully supplied; don't merge VMAlertmanagerConfig CRs
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-retain   # silences + nflog survive reboots
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
defaultRules:
  enabled: false                     # using the curated VMRule instead

# --- Grafana ---
grafana:
  enabled: true
  persistence:
    enabled: false                  # stateless; dashboards provisioned from configmaps
  testFramework:
    enabled: false                  # no test-hook pod
  admin:
    existingSecret: grafana-admin   # materialised by the ExternalSecret in Task 2
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: LoadBalancer
    port: 80
    annotations:
      io.cilium/lb-ipam-ips: "192.168.178.4"   # pin LAN IP (see gateway/gateway.yaml)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # OIDC login via Authelia. Local admin (existingSecret above) stays as break-glass.
  grafana.ini:
    server:
      root_url: https://grafana.senger-solutions.com
    auth.generic_oauth:
      enabled: true
      name: Authelia
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://auth.senger-solutions.com/api/oidc/authorization
      token_url: https://auth.senger-solutions.com/api/oidc/token
      api_url: https://auth.senger-solutions.com/api/oidc/userinfo
      use_pkce: true
      role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret

# --- Dashboards (node/kube/object) ---
defaultDashboards:
  enabled: true

# --- Built-in scrapes: enable only what Talos actually serves ---
kubelet:
  enabled: true
kubeApiServer:
  enabled: true
coreDns:
  enabled: true                     # scrapes kube-dns:9153
kubeControllerManager:
  enabled: false                    # Talos: binds to loopback, not scrapable
kubeScheduler:
  enabled: false                    # Talos: binds to loopback, not scrapable
kubeEtcd:
  enabled: false                    # Talos: needs client certs, out of scope
kubeProxy:
  enabled: false                    # no kube-proxy (Cilium replacement)

# --- Dependency chart resource trims ---
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
