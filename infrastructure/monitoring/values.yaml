# Explicit docker.io so Kyverno's registry allowlist matches: prefixes the operator image, and
# (via VM_CONTAINERREGISTRY) every image the operator deploys, alertmanager included.
global:
  image:
    registry: docker.io

# --- VM operator ---
victoria-metrics-operator:
  enabled: true
  crds:
    # CRDs via infrastructure/monitoring-crds. Disable the stack's own CRD
    # machinery (crds.enabled needs plain: false too).
    enabled: false
    plain: false
    # pre-delete hook; split the ref so global.image.registry doesn't render docker.io/registry.k8s.io/...
    cleanup:
      image: { registry: registry.k8s.io, repository: kubectl }
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# --- Metrics store: VMSingle ---
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    replicaCount: 1
    storage:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn    # default Delete class; metrics are reproducible
      resources:
        requests:
          storage: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi                 # was OOMKilled at 512Mi
# --- Scrape agent: VMAgent ---
vmagent:
  enabled: true
  spec:
    selectAllByDefault: true        # auto-select every VMServiceScrape/VMPodScrape
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# --- Alerting ---
vmalert:
  enabled: true
  spec:
    evaluationInterval: 30s
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
alertmanager:
  enabled: true
  spec:
    configSecret: alertmanager-config
    selectAllByDefault: false        # config fully supplied; don't merge VMAlertmanagerConfig CRs
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-retain   # silences + nflog survive reboots
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 128Mi }
defaultRules:
  enabled: false                     # using the curated VMRule instead

# --- Grafana ---
grafana:
  enabled: true
  persistence:
    enabled: false                  # stateless; dashboards provisioned from configmaps
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana-admin   # from grafana-externalsecret.yaml
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: LoadBalancer
    port: 80
    annotations:
      io.cilium/lb-ipam-ips: "192.168.178.4"   # pin LAN IP (see gateway/gateway.yaml)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 768Mi
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # OIDC login via Authelia. Local admin (existingSecret above) stays as break-glass.
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/Homelab/homelab-home.json
    server:
      root_url: https://grafana.senger-solutions.com
    auth.generic_oauth:
      enabled: true
      name: Authelia
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://auth.senger-solutions.com/api/oidc/authorization
      token_url: https://auth.senger-solutions.com/api/oidc/token
      api_url: https://auth.senger-solutions.com/api/oidc/userinfo
      use_pkce: true
      role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret

# --- Dashboards ---
defaultDashboards:
  enabled: true
  annotations:
    grafana_folder: Kubernetes
  dashboards:
    victoriametrics-vmalert: { enabled: false }
    victoriametrics-operator: { enabled: false }
    grafana-overview: { enabled: false }
    apiserver: { enabled: false }
    kubernetes-system-api-server: { enabled: false }
    kubernetes-system-coredns: { enabled: false }
    kubelet: { enabled: false }
    cluster-total: { enabled: false }
    pod-total: { enabled: false }
    workload-total: { enabled: false }
    namespace-by-pod: { enabled: false }
    namespace-by-workload: { enabled: false }
    k8s-resources-multicluster: { enabled: false }
    k8s-resources-node: { enabled: false }
    k8s-resources-nodes-overview: { enabled: false }
    k8s-resources-workloads-namespace: { enabled: false }
    k8s-resources-windows-cluster: { enabled: false }
    k8s-resources-windows-namespace: { enabled: false }
    k8s-resources-windows-pod: { enabled: false }
    k8s-windows-cluster-rsrc-use: { enabled: false }
    k8s-windows-node-rsrc-use: { enabled: false }
    kubernetes-views-global: { enabled: false }
    kubernetes-views-namespaces: { enabled: false }
    kubernetes-views-nodes: { enabled: false }
    kubernetes-views-pods: { enabled: false }
    node-cluster-rsrc-use: { enabled: false }
    node-rsrc-use: { enabled: false }
    nodes: { enabled: false }
    nodes-aix: { enabled: false }
    nodes-darwin: { enabled: false }
    persistentvolumesusage: { enabled: false }
    prometheus: { enabled: false }
    prometheus-remote-write: { enabled: false }

# --- Built-in scrapes: enable only what Talos actually serves ---
kubelet:
  enabled: true
kubeApiServer:
  enabled: true
  vmScrape:
    spec:
      endpoints:
        - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          port: https
          scheme: https
          tlsConfig:
            caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            serverName: kubernetes
          max_scrape_size: 64MiB    # /metrics is ~17MB, over the 16MiB default
coreDns:
  enabled: true                     # scrapes kube-dns:9153
kubeControllerManager:
  enabled: false                    # Talos: binds to loopback, not scrapable
kubeScheduler:
  enabled: false                    # Talos: binds to loopback, not scrapable
kubeEtcd:
  enabled: false                    # Talos: needs client certs, out of scope
kubeProxy:
  enabled: false                    # no kube-proxy (Cilium replacement)

# --- Dependency chart resource trims ---
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
