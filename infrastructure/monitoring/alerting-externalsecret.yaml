# infrastructure/monitoring/alerting-externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      # VMAlertmanager configSecret reads the alertmanager.yaml key verbatim.
      data:
        alertmanager.yaml: |
          route:
            receiver: email
            group_by: ['alertname', 'namespace']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - matchers: ['alertname="Watchdog"']
                receiver: deadman
                group_wait: 0s
                group_interval: 5m
                repeat_interval: 5m
          receivers:
            - name: email
              email_configs:
                - to: '{{ .recipient }}'
                  from: 'alerts@senger-solutions.com'
                  smarthost: 'smtp.resend.com:587'
                  auth_username: 'resend'
                  auth_password: '{{ .resendPassword }}'
                  require_tls: true
                  send_resolved: true
            - name: deadman
              webhook_configs:
                - url: '{{ .hcUrl }}'
                  send_resolved: false
  data:
    - secretKey: recipient
      remoteRef: { key: alerting/email, property: recipient }
    - secretKey: resendPassword
      remoteRef: { key: alerting/email, property: resend-password }
    - secretKey: hcUrl
      remoteRef: { key: alerting/email, property: hc-url }
