apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: gateway
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: gateway
  labels:
    app: whoami
spec:
  selector:
    app: whoami
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: gateway
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  hostnames:
    - whoami.senger-solutions.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Gate whoami behind Authelia via the native GEP-1494 HTTPRoute ExternalAuth
      # filter (Cilium 1.20 / Gateway API v1.6.1 experimental channel). Verified
      # live 2026-09-15 with `kubectl explain httproute.spec.rules.filters.externalAuth
      # --recursive`. Requires a ReferenceGrant in the authelia namespace so this
      # route (ns gateway) may reference the authelia Service cross-namespace.
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authelia
              namespace: authelia
              port: 9091
            http:
              path: /api/authz/ext-authz/
              # Authelia Envoy ext_authz contract (authorization_request.allowed_headers):
              # https://www.authelia.com/integration/proxies/envoy/
              allowedHeaders:
                - authorization
                - proxy-authorization
                - cookie
                - accept
              # Authelia's ext_authz response carries identity as remote-* headers
              # (remote-user, remote-groups, remote-name, remote-email) plus any
              # authelia-* headers; forward both prefixes to the backend.
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - group: ""
          kind: Service
          name: whoami
          port: 80
          weight: 1
