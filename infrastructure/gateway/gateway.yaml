apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: gateway
  annotations:
    # Pin the Gateway's LoadBalancer Service to the reserved front-door IP.
    io.cilium/lb-ipam-ips: "192.168.178.3"
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.senger-solutions.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-senger-solutions-tls
      allowedRoutes:
        namespaces:
          from: All
    # Wildcard above doesn't match the bare apex; cert already has the apex SAN.
    - name: https-apex
      protocol: HTTPS
      port: 443
      hostname: "senger-solutions.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-senger-solutions-tls
      allowedRoutes:
        namespaces:
          from: All
