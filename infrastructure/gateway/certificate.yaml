apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-senger-solutions
  namespace: gateway
spec:
  secretName: wildcard-senger-solutions-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.senger-solutions.com"
  dnsNames:
    - "*.senger-solutions.com"
    - "senger-solutions.com"
