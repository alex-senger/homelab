# CRDs ship as templates gated by crds.enabled (default false); enabling it
# installs them (no Helm crds/ dir, so --include-crds is a no-op, like argo-cd).
crds:
  enabled: true

# Modest footprint.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
