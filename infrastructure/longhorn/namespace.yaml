apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    # Mandatory, not cosmetic. Talos enforces PodSecurity "baseline" cluster-wide
    # and exempts only kube-system. Longhorn's manager and instance-manager run
    # privileged, so without this label every pod is rejected at admission and
    # the error blames PodSecurity rather than storage. Verified 2026-08-20.
    pod-security.kubernetes.io/enforce: privileged
