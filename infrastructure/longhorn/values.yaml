defaultSettings:
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: 1
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 15

# NOTE: on chart longhorn-1.12.1, backupTarget/backupTargetCredentialSecret
# are NOT defaultSettings keys (the defaultSettings ConfigMap template has no
# such fields, so they'd silently be dropped). They live under this separate
# top-level defaultBackupStore key, which the chart's default-resource.yaml
# template renders into the longhorn-default-resource ConfigMap
# (backup-target / backup-target-credential-secret). Confirmed by reading
# infrastructure/longhorn/charts/longhorn-1.12.1/longhorn/templates/
# default-resource.yaml and values.yaml directly.
defaultBackupStore:
  backupTarget: s3://backups@garage/longhorn
  backupTargetCredentialSecret: longhorn-backup-credential

persistence:
  defaultClass: true
  defaultClassReplicaCount: 1
  reclaimPolicy: Delete

# Needed for Argo CD compatibility
preUpgradeChecker:
  jobEnabled: false
