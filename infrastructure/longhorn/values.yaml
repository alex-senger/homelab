defaultSettings:
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: 1
  storageOverProvisioningPercentage: 200
  storageMinimalAvailablePercentage: 15

# backupTarget lives under defaultBackupStore, NOT defaultSettings (chart
# 1.12.1 would silently drop it there).
defaultBackupStore:
  backupTarget: s3://backups@garage/longhorn
  backupTargetCredentialSecret: longhorn-backup-credential

persistence:
  defaultClass: true
  defaultClassReplicaCount: 1
  reclaimPolicy: Delete

# Needed for Argo CD compatibility
preUpgradeChecker:
  jobEnabled: false
