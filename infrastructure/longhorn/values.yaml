defaultSettings:
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: 1
  storageOverProvisioningPercentage: 200
  storageMinimalAvailablePercentage: 15
  concurrentAutomaticEngineUpgradePerNodeLimit: 1

# backupTarget lives under defaultBackupStore; the chart silently drops it from defaultSettings.
defaultBackupStore:
  backupTarget: s3://backups@garage/longhorn
  backupTargetCredentialSecret: longhorn-backup-credential

persistence:
  defaultClass: true
  defaultClassReplicaCount: 1
  reclaimPolicy: Delete

# Helm pre-upgrade hook; Longhorn docs require disabling it under ArgoCD.
preUpgradeChecker:
  jobEnabled: false
