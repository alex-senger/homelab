# Single-node raft: replicas=1 = raft storage without quorum; a brief outage on
# reboot is fine (synced k8s Secrets persist).
global:
  enabled: true
injector:
  enabled: false   # ESO handles secret delivery; the agent injector is unused
server:
  image:
    # repository must NOT repeat the registry (chart prepends quay.io) or the
    # image becomes quay.io/quay.io/openbao/openbao.
    repository: openbao/openbao
    tag: "2.7.0"
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = true
        }
        storage "raft" {
          path = "/openbao/data"
        }
        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: longhorn-retain
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
