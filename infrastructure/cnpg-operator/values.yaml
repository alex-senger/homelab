# CloudNativePG operator 0.29.0 (app 1.30.0). CRDs render as templates
# (crds.create: true default) so this Application carries them.
crds:
  create: true

# No Prometheus-operator PodMonitor — we use VM's VMPodScrape (postgres component).
monitoring:
  podMonitorEnabled: false

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 200Mi
