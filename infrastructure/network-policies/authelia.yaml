apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: authelia
spec:
  endpointSelector: {}
  ingress:
    # intra-namespace
    - fromEndpoints:
        - {}
    # Gateway/Envoy proxies L7 gateway traffic with the reserved `ingress` identity
    # (OIDC discovery/token + ext-authz forward-auth); `host` kept for node-sourced paths.
    - fromEntities:
        - ingress
        - host
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
