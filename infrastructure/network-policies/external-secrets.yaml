apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: external-secrets
spec:
  endpointSelector: {}
  ingress:
    # intra-namespace: controller ↔ webhook ↔ cert-controller
    - fromEndpoints:
        - {}
    # kube-apiserver calls the validating/mutating webhook (all ports — apiserver is trusted)
    - fromEntities:
        - kube-apiserver
