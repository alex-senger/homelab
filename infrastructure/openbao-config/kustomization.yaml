apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openbao

configMapGenerator:
  - name: openbao-config-script
    files:
      - configure.sh
  - name: openbao-policies
    files:
      - eso-read.hcl
      - admin.hcl
      - oidc-role.json

generatorOptions:
  disableNameSuffixHash: false

resources:
  - oidc-externalsecret.yaml
  - job.yaml
