apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-oidc
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openbao-oidc
    creationPolicy: Owner
  data:
    # Plaintext client secret; Authelia gets the hash (authelia/secrets-externalsecret.yaml).
    - secretKey: client-secret
      remoteRef: { key: openbao/oidc, property: client-secret }
