apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs (Cilium ships none), applied before its Gateway controller
# starts (sync-wave -2).
#
# EXPERIMENTAL channel, pinned to v1.6.1. Two reasons this is the experimental
# and not the standard channel:
#   1. Cilium 1.20's Gateway controller requires ReferenceGrant v1, TLSRoute,
#      and BackendTLSPolicy to exist at startup (else it aborts and never syncs
#      Gateway TLS secrets into cilium-secrets — the Envoy listener then has no
#      cert and all TLS resets). v1.6.1 provides these.
#   2. Forward-auth (#7b) uses the GEP-1494 HTTPRoute filter `type: ExternalAuth`
#      to gate whoami through Authelia. That filter exists ONLY in the
#      experimental channel's HTTPRoute CRD; the standard channel omits it.
# Existing v1 Gateways/HTTPRoutes are unaffected (experimental is a superset).
resources:
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/experimental/gateway.networking.k8s.io_gatewayclasses.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/experimental/gateway.networking.k8s.io_gateways.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/experimental/gateway.networking.k8s.io_httproutes.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/experimental/gateway.networking.k8s.io_grpcroutes.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/experimental/gateway.networking.k8s.io_referencegrants.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/experimental/gateway.networking.k8s.io_tlsroutes.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/experimental/gateway.networking.k8s.io_backendtlspolicies.yaml
