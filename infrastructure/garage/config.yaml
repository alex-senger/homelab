apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    # Required by Garage even single-node; rpc_secret comes from GARAGE_RPC_SECRET.
    rpc_bind_addr = "[::]:3901"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage"
    [admin]
    api_bind_addr = "[::]:3903"
