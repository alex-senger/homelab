apiVersion: v1
kind: Service
metadata:
  name: nextcloud-notify-push
  namespace: nextcloud
spec:
  # Targets the notify_push sidecar (port 7867) running in the Nextcloud pod.
  selector:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: nextcloud
  ports:
    - port: 7867
      targetPort: 7867
      protocol: TCP
