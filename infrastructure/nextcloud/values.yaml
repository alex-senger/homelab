image:
  repository: nextcloud
  tag: 33.0.8-apache

replicaCount: 1

nextcloud:
  host: nextcloud.senger-solutions.com
  existingSecret:
    enabled: true
    secretName: nextcloud-app
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
    tokenKey: nextcloud-token
  configs:
    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://nextcloud.senger-solutions.com',
        'overwritehost' => 'nextcloud.senger-solutions.com',
        'trusted_domains' => array('nextcloud.senger-solutions.com'),
        'trusted_proxies' => array('10.0.0.0/8'),
        'default_phone_region' => 'DE',
        'memcache.local' => '\\OC\\Memcache\\APCu',
        'allow_local_remote_servers' => true,
      );
    preview.config.php: |-
      <?php
      $CONFIG = array (
        'preview_imaginary_url' => 'http://nextcloud-imaginary',
        'enabledPreviewProviders' => array(
          'OC\\Preview\\Imaginary',
          'OC\\Preview\\ImaginaryPDF',
          'OC\\Preview\\MP3',
          'OC\\Preview\\TXT',
          'OC\\Preview\\MarkDown',
          'OC\\Preview\\OpenDocument',
          'OC\\Preview\\Movie',
        ),
      );
  # Redis-backed distributed cache + transactional file locking (the image
  # auto-writes redis.config.php from these). Redis runs as our own minimal
  # standalone Deployment (nextcloud-redis), not the chart's bitnami subchart.
  extraEnv:
    - name: REDIS_HOST
      value: nextcloud-redis
    - name: REDIS_HOST_PORT
      value: "6379"
    - name: REDIS_HOST_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-redis
          key: password
  # notify_push (High-Performance Backend) as a sidecar: shares config.php +
  # the app binary (custom_apps PVC). Waits until the operator installs the
  # notify_push app, then serves on :7867. Redis via env (separate config file);
  # DB/secret/instanceid read from config.php.
  extraSidecarContainers:
    - name: notify-push
      image: nextcloud:33.0.8-apache
      command:
        - sh
        - -c
        - 'BIN=/var/www/html/custom_apps/notify_push/bin/x86_64/notify_push; until [ -x "$BIN" ]; do echo "waiting for notify_push app..."; sleep 10; done; exec "$BIN" /var/www/html/config/config.php --port 7867'
      env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: nextcloud-redis
              key: url
        - name: NEXTCLOUD_URL
          value: https://nextcloud.senger-solutions.com
      ports:
        - name: push
          containerPort: 7867
      volumeMounts:
        - { name: nextcloud-main, mountPath: /var/www/html/config, subPath: config }
        - { name: nextcloud-main, mountPath: /var/www/html/custom_apps, subPath: custom_apps }
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
  phpConfigs:
    zz-uploads.ini: |-
      upload_max_filesize=2G
      post_max_size=2G
      memory_limit=1G

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: pg-rw.databases.svc:5432
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-app
    usernameKey: db-username
    passwordKey: db-password
    hostKey: db-host
    databaseKey: db-name

redis:
  enabled: false   # we run our own minimal nextcloud-redis Deployment instead

imaginary:
  enabled: true    # fast previews (HEIC/PDF/video/RAW), wired via preview.config.php

cronjob:
  enabled: true

persistence:
  enabled: true
  storageClass: longhorn-retain
  size: 10Gi
  nextcloudData:
    enabled: true
    storageClass: longhorn-retain
    size: 150Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
