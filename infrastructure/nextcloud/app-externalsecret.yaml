apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-app
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-app
    creationPolicy: Owner
    template:
      data:
        # admin (break-glass) account for the chart's existingSecret
        nextcloud-username: "admin"
        nextcloud-password: "{{ .adminPassword }}"
        nextcloud-token: "{{ .adminPassword }}"
        # external DB connection for the chart's externalDatabase.existingSecret
        db-username: "nextcloud"
        db-password: "{{ .dbPassword }}"
        db-host: "pg-rw.databases.svc:5432"
        db-name: "nextcloud"
  data:
    - secretKey: adminPassword
      remoteRef: { key: nextcloud/app, property: admin-password }
    - secretKey: dbPassword
      remoteRef: { key: databases/nextcloud, property: password }
