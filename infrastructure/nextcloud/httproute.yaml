apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
      namespace: gateway
  hostnames:
    - nextcloud.senger-solutions.com
  rules:
    # notify_push HPB — more specific, matched first.
    - matches:
        - path: { type: PathPrefix, value: /push }
      backendRefs:
        - group: ""
          kind: Service
          name: nextcloud-notify-push
          port: 7867
          weight: 1
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - group: ""
          kind: Service
          name: nextcloud
          port: 8080
          weight: 1
