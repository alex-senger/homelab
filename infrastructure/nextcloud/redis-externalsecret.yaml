apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-redis
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: nextcloud-redis
    creationPolicy: Owner
    template:
      data:
        # Consumed by: redis-server --requirepass, Nextcloud REDIS_HOST_PASSWORD,
        # and notify_push REDIS_URL
        password: "{{ .password }}"
        url: "redis://:{{ .password }}@nextcloud-redis:6379"
  data:
    - secretKey: password
      remoteRef:
        key: nextcloud/redis
        property: password
