apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud

resources:
  - namespace.yaml
  - app-externalsecret.yaml
  - httproute.yaml
  - redis-externalsecret.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - notify-push-service.yaml

helmCharts:
  - name: nextcloud
    repo: https://nextcloud.github.io/helm/
    version: 9.4.0
    releaseName: nextcloud
    namespace: nextcloud
    valuesFile: values.yaml

patches:
  - path: php-confd-patch.yaml
