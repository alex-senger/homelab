apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud

resources:
  - namespace.yaml
  - app-externalsecret.yaml
  - httproute.yaml

helmCharts:
  - name: nextcloud
    repo: https://nextcloud.github.io/helm/
    # renovate: datasource=helm depName=nextcloud registryUrl=https://nextcloud.github.io/helm/
    version: 9.2.6
    releaseName: nextcloud
    namespace: nextcloud
    valuesFile: values.yaml
