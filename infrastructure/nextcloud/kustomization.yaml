apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud

resources:
  - namespace.yaml
  - app-externalsecret.yaml
  - httproute.yaml

helmCharts:
  - name: nextcloud
    repo: https://nextcloud.github.io/helm/
    # renovate: datasource=helm depName=nextcloud registryUrl=https://nextcloud.github.io/helm/
    version: 9.2.6
    releaseName: nextcloud
    namespace: nextcloud
    valuesFile: values.yaml

# The chart has no hostAliases support. The pod does OIDC discovery + token
# exchange server-side, but auth.senger-solutions.com resolves publicly and the
# hairpin fails (cf. argocd #44) — pin it to the in-cluster Gateway.
patches:
  - target:
      kind: Deployment
      name: nextcloud
    patch: |-
      - op: add
        path: /spec/template/spec/hostAliases
        value:
          - ip: 192.168.178.3
            hostnames:
              - auth.senger-solutions.com
