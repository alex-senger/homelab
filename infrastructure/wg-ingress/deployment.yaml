apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-ingress
  namespace: wg-ingress
  labels:
    app: wg-ingress
spec:
  # Persistent key: a reschedule re-dials the same VPS peer, no VPS change.
  replicas: 1
  selector:
    matchLabels:
      app: wg-ingress
  template:
    metadata:
      labels:
        app: wg-ingress
    spec:
      containers:
        # Dials out to the VPS and brings up wg0 from the hand-created client conf.
        - name: wireguard
          # renovate: datasource=docker depName=linuxserver/wireguard
          image: linuxserver/wireguard:1.0.20260223-r0-ls121
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          securityContext:
            capabilities:
              add:
                # NET_ADMIN only — Talos refuses SYS_MODULE; wg module already loaded.
                - NET_ADMIN
          volumeMounts:
            - name: wg-config
              mountPath: /config/wg_confs/wg0.conf
              subPath: wg0.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        # L4 byte relay from the tunnel to the Gateway's Envoy.
        - name: relay
          # renovate: datasource=docker depName=alpine/socat
          image: alpine/socat:1.8.1.3
          args:
            - -d
            - TCP-LISTEN:443,fork,reuseaddr
            - TCP:cilium-gateway-external.gateway.svc.cluster.local:443
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: relay-minecraft
          # renovate: datasource=docker depName=alpine/socat
          image: alpine/socat:1.8.1.3
          args:
            - -d
            - TCP-LISTEN:25565,fork,reuseaddr
            - TCP:minecraft.minecraft.svc.cluster.local:25565
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        # wg0.conf: client tunnel config, hand-created out-of-band; never committed.
        - name: wg-config
          secret:
            secretName: wg-ingress-key
