apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wg-ingress-key
  namespace: wg-ingress
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: wg-ingress-key
    creationPolicy: Owner
  data:
    - secretKey: wg0.conf
      remoteRef:
        key: wg-ingress/wg-ingress-key
        property: wg0.conf
