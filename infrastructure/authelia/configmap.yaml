apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    server:
      address: 'tcp://:9091'
    log:
      level: info
    theme: dark
    totp:
      issuer: senger-solutions.com
    webauthn:
      disable: false
      display_name: senger-solutions.com
      # Passkey (discoverable-credential) login, usable across *.senger-solutions.com.
      enable_passkey_login: true
      # A user-verifying passkey counts as two_factor (passwordless + 2FA).
      experimental_enable_passkey_uv_two_factors: true
      attestation_conveyance_preference: indirect
      selection_criteria:
        user_verification: preferred
        discoverability: preferred
    session:
      name: authelia_session
      same_site: lax
      expiration: 1h
      inactivity: 5m
      cookies:
        - domain: senger-solutions.com
          authelia_url: https://auth.senger-solutions.com
    storage:
      postgres:
        address: tcp://pg-rw.databases.svc:5432
        database: authelia
        username: authelia
    authentication_backend:
      file:
        path: /users/users_database.yml
        password:
          algorithm: argon2
    notifier:
      filesystem:
        filename: /data/notification.txt
    access_control:
      default_policy: bypass
      rules:
        - domain: auth.senger-solutions.com
          policy: bypass
        - domain: nextcloud.senger-solutions.com
          policy: bypass
        - domain: grafana.senger-solutions.com
          policy: bypass
    identity_providers:
      oidc:
        jwks:
          - key_id: primary
            algorithm: RS256
            use: sig
            key: {{ secret "/secrets/OIDC_ISSUER_PRIVATE_KEY" | mindent 14 "|" | msquote }}
        clients:
          - client_id: argocd
            client_name: ArgoCD
            client_secret: {{ secret "/secrets/OIDC_ARGOCD_CLIENT_SECRET_HASH" | mindent 14 "|" | msquote }}
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - https://argocd.senger-solutions.com/auth/callback
              - http://localhost:8085/auth/callback
            scopes: [openid, profile, groups, email]
            grant_types: [authorization_code]
            response_types: [code]
            # First-party app: skip the consent screen.
            consent_mode: implicit
            userinfo_signed_response_alg: none
          - client_id: grafana
            client_name: Grafana
            client_secret: {{ secret "/secrets/OIDC_GRAFANA_CLIENT_SECRET_HASH" | mindent 14 "|" | msquote }}
            public: false
            authorization_policy: two_factor
            redirect_uris:
              - https://grafana.senger-solutions.com/login/generic_oauth
            scopes: [openid, profile, groups, email]
            grant_types: [authorization_code]
            response_types: [code]
            # First-party app: skip the consent screen.
            consent_mode: implicit
            userinfo_signed_response_alg: none
          - client_id: nextcloud
            client_name: Nextcloud
            client_secret: {{ secret "/secrets/OIDC_NEXTCLOUD_CLIENT_SECRET_HASH" | mindent 14 "|" | msquote }}
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://nextcloud.senger-solutions.com/apps/user_oidc/code
            scopes: [openid, profile, groups, email]
            grant_types: [authorization_code]
            response_types: [code]
            # Nextcloud user_oidc sends client creds in the POST body, not Basic.
            token_endpoint_auth_method: client_secret_post
            # First-party app: skip the consent screen.
            consent_mode: implicit
            userinfo_signed_response_alg: none
