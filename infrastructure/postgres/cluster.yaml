apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: databases
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-202609210816-minimal-trixie

  storage:
    size: 5Gi
    storageClass: longhorn-retain

  # WAL archiver + backup plugin, backed by the Garage ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-backups

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Declarative role management: create/own the authelia role, password from
  # the ESO-materialised basic-auth secret.
  managed:
    roles:
      - name: authelia
        ensure: present
        login: true
        passwordSecret:
          name: authelia-db
      - name: nextcloud
        ensure: present
        login: true
        passwordSecret:
          name: nextcloud-db
