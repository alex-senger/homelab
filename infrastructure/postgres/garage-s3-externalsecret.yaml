apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: garage-s3
    creationPolicy: Owner
    template:
      # REGION is a fixed config value, not a secret: Garage enforces its
      # configured s3_region ("garage" in infrastructure/garage/config.yaml)
      # in the SigV4 signature, so the Barman ObjectStore must sign with the
      # same region or every WAL/backup upload fails AuthorizationHeaderMalformed.
      # Injected as a literal here (like the Longhorn ExternalSecret's
      # AWS_ENDPOINTS) so no OpenBao entry is needed for it.
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .ACCESS_SECRET_KEY }}"
        REGION: "garage"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: garage/s3, property: access-key-id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: garage/s3, property: secret-access-key }
