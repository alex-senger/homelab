apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: garage-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: garage/s3, property: access-key-id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: garage/s3, property: secret-access-key }
