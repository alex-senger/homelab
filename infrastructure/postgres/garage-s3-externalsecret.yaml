apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: garage-s3
    creationPolicy: Owner
    template:
      # REGION is config, not secret: Garage enforces s3_region "garage" in
      # SigV4, so Barman must sign with it or uploads fail
      # AuthorizationHeaderMalformed. Literal (no OpenBao entry needed).
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .ACCESS_SECRET_KEY }}"
        REGION: "garage"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: garage/s3, property: access-key-id }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: garage/s3, property: secret-access-key }
