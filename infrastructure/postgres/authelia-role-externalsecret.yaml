apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-db
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: authelia-db
    creationPolicy: Owner
    template:
      # CNPG managed.roles passwordSecret must be a basic-auth secret with
      # username + password.
      type: kubernetes.io/basic-auth
      data:
        username: "authelia"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: databases/authelia
        property: password
