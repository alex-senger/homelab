---
firewall_rules:
  - { rule: limit, port: "22", proto: tcp, comment: SSH }
  - { rule: allow, port: "51821", proto: udp, comment: WireGuard - k8s cluster tunnel }
  - { rule: allow, port: "25565", proto: tcp, comment: Minecraft }

# https://www.cloudflare.com/ips/ — update by hand when Cloudflare changes them.
firewall_cloudflare_ipv4_ranges:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
firewall_cloudflare_ipv6_ranges:
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32

# devsec.hardening.ssh_hardening
ssh_allow_users: asg
ssh_client_alive_interval: 120
ssh_max_auth_retries: 3  # devsec default 2 trips agents holding several keys
ssh_client_hardening: false
sftp_chroot: false

# robertdebock.fail2ban (role asserts numbers for these three)
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5
fail2ban_jail_configuration:
  - { section: DEFAULT, option: backend, value: systemd }
  - { section: DEFAULT, option: banaction, value: nftables }
  - { section: DEFAULT, option: banaction_allports, value: "nftables[type=allports]" }
  - { section: sshd, option: enabled, value: "true" }
  - { section: sshd, option: port, value: "22" }
  - { section: sshd, option: filter, value: sshd }
  - { section: sshd, option: maxretry, value: "3" }
  - { section: sshd, option: bantime, value: 24h }

# hifis.toolkit.unattended_upgrades
unattended_origins_patterns:
  - origin=Debian,codename=${distro_codename},label=Debian
  - origin=Debian,codename=${distro_codename},label=Debian-Security
  - origin=Debian,codename=${distro_codename}-security,label=Debian-Security

# nginx_stream
nginx_stream_sni_routes: []
nginx_stream_sni_default_upstream: "10.10.0.2:443"
nginx_stream_tcp_passthrough:
  # proxy_protocol requires Paper to expect it (PR #98).
  - { port: 25565, upstream: "10.10.0.2:25565", proxy_protocol: true }
