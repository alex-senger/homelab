---
- name: Configure the VPS
  hosts: vps
  become: true
  roles:
    - role: base
      tags: [base]
    - role: devsec.hardening.ssh_hardening
      tags: [sshd]
    - role: firewall
      tags: [firewall]
    - role: robertdebock.fail2ban
      tags: [fail2ban]
    - role: hifis.toolkit.unattended_upgrades
      tags: [upgrades]
    - role: website
      tags: [website]
    - role: nginx
      tags: [nginx]

- name: Retire the cluster tunnel
  hosts: vps
  become: true
  tags: [wireguard]
  tasks:
    - name: Check for wg1
      ansible.builtin.stat:
        path: /etc/wireguard/wg1.conf
      register: wg1_conf

    - name: Stop and disable wg-quick@wg1
      ansible.builtin.systemd_service:
        name: wg-quick@wg1
        state: stopped
        enabled: false
      when: wg1_conf.stat.exists

    - name: Remove the wg1 config
      ansible.builtin.file:
        path: /etc/wireguard/wg1.conf
        state: absent

- name: Verify
  ansible.builtin.import_playbook: verify.yml
