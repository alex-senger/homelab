# Reference only — this is documentation of the SNI route the operator
# added to their own, pre-existing nginx `stream {}` block. It is NOT
# applied, templated, or otherwise managed by this Ansible. It is kept here
# so the mapping between the WireGuard tunnel and the VPS's nginx routing
# is discoverable, in case the two ever need to be reconciled.
#
# Reference only — added by the operator to the existing nginx stream{} block.
# Routes cluster hostnames over the WireGuard tunnel; everything else keeps
# going to Pangolin. No proxy_protocol (Pangolin does not expect it).
map $ssl_preread_server_name $upstream_443 {
    whoami.senger-solutions.com   10.10.0.2:443;   # cluster -> WireGuard tunnel (wg1)
    default                        100.89.169.43:443;  # existing -> Pangolin
}
server {
    listen 443;
    ssl_preread on;
    proxy_pass $upstream_443;
}
