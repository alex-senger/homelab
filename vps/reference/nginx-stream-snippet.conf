# Reference only — documents the SNI route the operator added to their own
# pre-existing nginx `stream {}` block; NOT applied or managed by this Ansible.
# Cluster hostnames go over the WireGuard tunnel; all else stays on Pangolin.
# No proxy_protocol (Pangolin does not expect it).
map $ssl_preread_server_name $upstream_443 {
    senger-solutions.com            10.10.0.2:443;   # apex website
    auth.senger-solutions.com       10.10.0.2:443;   # Authelia (public OIDC redirects)
    nextcloud.senger-solutions.com  10.10.0.2:443;   # Nextcloud
    default                         100.89.169.43:443;  # existing -> Pangolin
}
server {
    listen 443;
    ssl_preread on;
    proxy_pass $upstream_443;
}

# Minecraft (Java) is raw TCP on a dedicated port, not SNI-multiplexed on :443,
# so it's a plain passthrough over the tunnel to the wg-ingress :25565 relay.
# Also open the port on the VPS firewall: `ufw allow 25565/tcp`.
# proxy_protocol on: nginx is the last hop that sees the real client IP, so it
# prepends a PROXY header; relay-minecraft (socat) passes it through untouched
# and Paper (proxies.proxy-protocol: true) reads it.
server {
    listen 25565;
    proxy_pass 10.10.0.2:25565;   # -> wg-ingress relay-minecraft -> minecraft svc
    proxy_protocol on;
}
