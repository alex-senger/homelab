---
- name: Install wireguard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Template the wg0 interface config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart wg-quick@wg0

- name: Enable IPv4 forwarding persistently
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# Firewall choice: nftables (Debian's default nft-based successor to
# iptables/ufw). Ships a single declarative ruleset at /etc/nftables.conf
# loaded by the nftables.service unit — no separate rule-persistence package
# needed, unlike iptables-legacy. ufw would also work but is one more layer
# on top of nftables for no benefit on a single-purpose box like this.
- name: Template the nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Enable and start wg-quick@wg0
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
