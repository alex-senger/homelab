---
- name: Install podman
  ansible.builtin.apt:
    name: [podman, uidmap, passt, dbus-user-session]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the website user
  ansible.builtin.user:
    name: "{{ website_user }}"
    shell: /usr/sbin/nologin
    home: "{{ website_home }}"
    create_home: true
  register: website_account

- name: Grant subordinate ids
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ website_user }}:"
    line: "{{ website_user }}:{{ website_subid_start }}:65536"
  loop: [/etc/subuid, /etc/subgid]

- name: Enable lingering
  ansible.builtin.command: loginctl enable-linger {{ website_user }}
  args:
    creates: /var/lib/systemd/linger/{{ website_user }}

# PDFs are copied in by hand (docs/runbooks/website-recovery.md).
- name: Create the downloads directory
  ansible.builtin.file:
    path: "{{ website_downloads_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Quadlet directory
  ansible.builtin.file:
    path: "{{ website_home }}/{{ item }}"
    state: directory
    owner: "{{ website_user }}"
    group: "{{ website_user }}"
    mode: "0700"
  loop: [.config, .config/containers, .config/containers/systemd]

- name: Pull the pinned image
  become: true
  become_user: "{{ website_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ website_account.uid }}
  block:
    - name: Check for the pinned image
      ansible.builtin.command: podman image exists {{ website_image }}
      register: website_image_present
      changed_when: false
      failed_when: website_image_present.rc not in [0, 1]

    - name: Log in to ghcr
      ansible.builtin.command: podman login --username {{ website_ghcr_username }} --password-stdin ghcr.io
      args:
        stdin: "{{ website_ghcr_token }}"
      no_log: true
      changed_when: false
      when: website_image_present.rc == 1

    - name: Pull
      ansible.builtin.command: podman pull {{ website_image }}
      changed_when: true
      when: website_image_present.rc == 1
  # The token never stays on the VPS.
  always:
    - name: Log out of ghcr
      ansible.builtin.command: podman logout ghcr.io
      changed_when: false
      failed_when: false

- name: Template the Quadlet unit
  ansible.builtin.template:
    src: website.container.j2
    dest: "{{ website_home }}/.config/containers/systemd/website.container"
    owner: "{{ website_user }}"
    group: "{{ website_user }}"
    mode: "0600"
  notify: Restart website

- name: Apply unit changes
  ansible.builtin.meta: flush_handlers

- name: Start website
  ansible.builtin.systemd_service:
    name: website.service
    scope: user
    state: started
  become: true
  become_user: "{{ website_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ website_account.uid }}
