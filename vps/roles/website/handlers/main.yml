---
- name: Reload user units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ website_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ website_account.uid }}
  listen: Restart website

- name: Restart the website unit
  ansible.builtin.systemd_service:
    name: website.service
    scope: user
    state: restarted
  become: true
  become_user: "{{ website_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ website_account.uid }}
  listen: Restart website
