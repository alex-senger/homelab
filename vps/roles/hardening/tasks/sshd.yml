---
- name: Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: Validate merged sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
