---
- name: Deploy sysctl hardening drop-in
  ansible.builtin.template:
    src: 60-hardening.conf.j2
    dest: /etc/sysctl.d/60-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl

- name: Ensure unattended-upgrades is installed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy unattended-upgrades auto-reboot override
  ansible.builtin.template:
    src: 52hardening-overrides.j2
    dest: /etc/apt/apt.conf.d/52hardening-overrides
    owner: root
    group: root
    mode: "0644"
