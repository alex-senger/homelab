# Managed by Ansible (vps/roles/nginx_stream).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_server_name $upstream_443 {
        default 10.10.0.2:443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $upstream_443;
    }

    server {
        listen 25565;
        proxy_pass 10.10.0.2:25565;
        proxy_protocol on;
    }
}
