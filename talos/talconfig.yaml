clusterName: roastery
talosVersion: v1.13.9
kubernetesVersion: v1.36.2

# Single-node cluster: the node's own address is the API endpoint (no VIP —
# there is only one control-plane node).
endpoint: https://192.168.178.16:6443

allowSchedulingOnControlPlanes: true

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

# Cilium is installed by bootstrap/cilium immediately after bootstrap.
# Nodes stay NotReady until then, which is expected.
cniConfig:
  name: none

# required by Longhorn
controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools

patches:
  - "@./patches/all.yaml"

nodes:
  - hostname: roastery-cp-1
    ipAddress: 192.168.178.16
    controlPlane: true
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.178.16/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.178.1
    userVolumes:
      - name: longhorn
        provisioning:
          # The Longhorn data disk is the ~300 GB NVMe volume — the only disk
          # larger than 200 GB and not the ~40 GB system disk. The >200 GB
          # bound also excludes the ~100 GB HDD backup disk (mounted later in
          # #7d).
          diskSelector:
            match: disk.size > 200u * GB && !system_disk
          minSize: 200GiB
          maxSize: 270GiB
        filesystem:
          type: xfs
