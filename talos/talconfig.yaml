clusterName: roastery
talosVersion: v1.13.9
kubernetesVersion: v1.36.2

# Single-node: the node's address is the API endpoint (no VIP).
endpoint: https://192.168.178.16:6443

allowSchedulingOnControlPlanes: true

clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

# Cilium installed post-bootstrap by bootstrap/cilium; nodes NotReady until then.
cniConfig:
  name: none

# required by Longhorn
controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/util-linux-tools

patches:
  - "@./patches/all.yaml"

nodes:
  - hostname: roastery-1
    ipAddress: 192.168.178.16
    controlPlane: true
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.178.16/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.178.1
    userVolumes:
      - name: longhorn
        provisioning:
          # Longhorn data disk: the ~300GB NVMe (non-rotational, >200GB, not
          # system). !disk.rotational keeps it disjoint from the garage HDD.
          diskSelector:
            match: '!disk.rotational && disk.size > 200u * GB && !system_disk'
          minSize: 200GiB
          maxSize: 270GiB
        filesystem:
          type: xfs
      - name: garage
        provisioning:
          # HDD backup disk (the only rotational disk); kept off Longhorn.
          diskSelector:
            match: disk.rotational && !system_disk
          # minSize >= garage-data capacity (180Gi): a local PV doesn't enforce
          # capacity, so a too-small disk fails loudly here, not once backups grow.
          minSize: 180GiB
          maxSize: 195GiB
        filesystem:
          type: xfs
