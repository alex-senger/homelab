machine:
  kubelet:
    extraArgs:
      # Kubelet serves metrics over TLS with rotating certs. The CSRs this
      # produces are approved by kubelet-serving-cert-approver, which lets
      # metrics-server scrape over verified TLS rather than --kubelet-insecure-tls.
      rotate-server-certificates: "true"
  features:
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
cluster:
  proxy:
    disabled: true  # required by Cilium
