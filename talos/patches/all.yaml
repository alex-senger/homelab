machine:
  kubelet:
    extraArgs:
      # Kubelet serves metrics over TLS with rotating certs. The CSRs this
      # produces are approved by kubelet-serving-cert-approver, which lets
      # metrics-server scrape over verified TLS rather than --kubelet-insecure-tls.
      rotate-server-certificates: "true"
  features:
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  network:
    # In-cluster resolution of our external hostnames to the Cilium Gateway
    # (.3). Pods doing server-side calls (e.g. Nextcloud/ArgoCD OIDC discovery
    # to auth.senger-solutions.com) otherwise resolve the public IP and hairpin.
    # hostDNS + forwardKubeDNSToHost (above) makes CoreDNS forward to the host
    # resolver, so these /etc/hosts entries answer cluster-wide. Replaces the
    # per-app hostAlias workarounds.
    extraHostEntries:
      - ip: 192.168.178.3
        aliases:
          - auth.senger-solutions.com
          - nextcloud.senger-solutions.com
          - argocd.senger-solutions.com
cluster:
  proxy:
    disabled: true  # required by Cilium
