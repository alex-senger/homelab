# Applied by hand once after bootstrap: kubectl apply -f cluster/root.yaml.
# Uses project 'default' — the infrastructure/apps projects don't exist yet
# (this Application's first sync creates them).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/alex-senger/homelab.git
    targetRevision: main
    path: cluster

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers

  syncPolicy:
    automated:
      # Safe: manages only Applications/AppProjects; pruning one doesn't prune
      # what it manages (children carry no finalizer).
      prune: true
      selfHeal: true
