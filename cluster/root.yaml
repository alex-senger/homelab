# Applied by hand exactly once, after bootstrap:
#   kubectl apply -f cluster/root.yaml
#
# Uses project 'default' because the infrastructure and apps projects are
# created by this Application's own first sync — they do not exist yet when
# it is applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/alex-senger/homelab.git
    targetRevision: main
    path: cluster

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # ArgoCD manages finalizers on the Applications it creates, adding its own
  # beyond whatever Git declares. A chart shipping Helm pre-delete hooks — Longhorn
  # does — gets pre-delete-finalizer.argocd.argoproj.io and its /cleanup companion
  # attached by the controller. Git declares one finalizer, the live object then has
  # three, and root reports permanent drift it can never reconcile because the
  # controller re-adds them on every pass.
  #
  # Diffing on a controller-owned field is the bug, not the extra finalizers.
  # The declared resources-finalizer is still applied on creation; this only stops
  # root treating the controller's additions as drift. Observed 2026-08-20.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /metadata/finalizers

  syncPolicy:
    automated:
      # Safe here: this Application manages only Application and AppProject
      # resources. Pruning an Application does not prune what it manages
      # unless that Application carries a finalizer.
      prune: true
      selfHeal: true
