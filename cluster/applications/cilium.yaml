apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    # Wave -1: the CNI must exist before anything that needs pod networking.
    argocd.argoproj.io/sync-wave: "-1"
  # NO finalizer: a cascade-delete would take down the CNI and all pod
  # networking cluster-wide (recovery: docs/runbooks/cilium-recovery.md).
spec:
  project: infrastructure

  source:
    repoURL: https://github.com/alex-senger/homelab.git
    targetRevision: main
    path: infrastructure/cilium

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

  # Without this, Argo shows a permanent drift.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
