apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    # Wave 21: needs CNPG CRDs (12), ESO store (18), VM operator CRDs (19).
    argocd.argoproj.io/sync-wave: "21"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/alex-senger/homelab.git
    targetRevision: main
    path: infrastructure/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
  # CNPG defaults ~21 Cluster.spec fields at admission + normalises our
  # plugin/roles; operator-owned, absent from managedFields → permanent
  # OutOfSync. Ignore exactly those (from the live diff); a CNPG upgrade may
  # add one more.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      name: pg
      namespace: databases
      jqPathExpressions:
        - .spec.plugins[].enabled
        - .spec.managed.roles[].connectionLimit
        - .spec.managed.roles[].inherit
      jsonPointers:
        - /spec/affinity
        - /spec/bootstrap
        - /spec/enablePDB
        - /spec/enableSuperuserAccess
        - /spec/failoverDelay
        - /spec/logLevel
        - /spec/maxSyncReplicas
        - /spec/minSyncReplicas
        - /spec/monitoring
        - /spec/postgresGID
        - /spec/postgresUID
        - /spec/postgresql
        - /spec/primaryUpdateMethod
        - /spec/primaryUpdateStrategy
        - /spec/probes
        - /spec/replicationSlots
        - /spec/smartShutdownTimeout
        - /spec/startDelay
        - /spec/stopDelay
        - /spec/storage/resizeInUseVolumes
        - /spec/switchoverDelay
