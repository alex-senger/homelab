apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    # Wave -10: AppProjects must exist before any Application that references
    # them. Cilium sits at wave -1 so the CNI precedes everything else, which
    # without this would sort it ahead of its own project and fail the first
    # sync of a fresh cluster with "referencing project ... which does not
    # exist". Observed on the 2026-08-20 rebuild.
    argocd.argoproj.io/sync-wave: "-10"
  name: apps
  namespace: argocd
spec:
  description: >-
    User-facing workloads. Denied cluster-scoped resources so a third-party
    chart cannot grant itself cluster-admin or install CRDs.

  sourceRepos:
    - https://github.com/alex-senger/homelab.git

  # Namespaces planned in sub-project #6. Extend as applications are added;
  # an application targeting an unlisted namespace is refused.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: website
    - server: https://kubernetes.default.svc
      namespace: authelia
    - server: https://kubernetes.default.svc
      namespace: nextcloud

  # Empty: no cluster-scoped resource of any kind is permitted.
  clusterResourceWhitelist: []

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
