apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  name: apps
  namespace: argocd
spec:
  description: >-
    User-facing workloads. Cluster-scoped resources are denied except
    Namespace, so a third-party chart cannot grant itself cluster-admin or
    install CRDs, but each app can still own its namespace.

  sourceRepos:
    - https://github.com/alex-senger/homelab.git

  # Namespaces planned in sub-project #6. Extend as applications are added;
  # an application targeting an unlisted namespace is refused.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: website
    - server: https://kubernetes.default.svc
      namespace: authelia
    - server: https://kubernetes.default.svc
      namespace: nextcloud

  # Only Namespace: apps create their own namespace but no other cluster-scoped
  # resource (no CRDs, ClusterRoles, or bindings — no escalation path).
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
